services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vms-backend
    restart: unless-stopped
    ports:
      - "5001:5001"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=development
    volumes:
      - ./backend:/app                  # hot-reload: reflects code changes
      - /app/node_modules               # keep container's node_modules
    command: node server.js
    networks:
      - vms-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev        # dev dockerfile (see below)
    container_name: vms-frontend
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:5001/api
      - PORT=3000
      - NEXT_PUBLIC_GOOGLE_CLIENT_ID=235457272762-ncmic1lgfo40babq2uhk0egrdr4h0rt1.apps.googleusercontent.com
    volumes:
      - ./frontend:/app                 # hot-reload: reflects code changes
      - /app/node_modules               # keep container's node_modules
      - /app/.next                      # keep build cache
    depends_on:
      - backend
    networks:
      - vms-network

networks:
  vms-network:
    driver: bridge
