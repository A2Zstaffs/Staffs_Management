# =============================================================
# A2Z Staffs VMS - Nginx Configuration
# Copy to: /etc/nginx/sites-available/a2zstaffs
# Then: sudo ln -s /etc/nginx/sites-available/a2zstaffs /etc/nginx/sites-enabled/
# Replace 'a2zstaffs.com' with your actual domain throughout
# =============================================================

# Rate limiting zones — defined at http context (add to /etc/nginx/nginx.conf inside http{} block,
# or place here if using an include-based setup)
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name a2zstaffs.com www.a2zstaffs.com;
    return 301 https://$server_name$request_uri;
}

# Main HTTPS server
server {
    listen 443 ssl;
    server_name a2zstaffs.com www.a2zstaffs.com;

    # SSL — managed by Certbot (auto-filled after: sudo certbot --nginx -d a2zstaffs.com)
    # ssl_certificate /etc/letsencrypt/live/a2zstaffs.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/a2zstaffs.com/privkey.pem;

    # Security headers (adds on top of Helmet.js which is already in Express)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Serve Next.js static assets directly from disk — bypasses Node entirely
    # Much faster + saves RAM on t3.micro
    location /_next/static/ {
        alias /home/ubuntu/Staffs_Management/VMS/Frontend/.next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Serve public directory static files (favicon, robots.txt, images)
    location /favicon.png {
        alias /home/ubuntu/Staffs_Management/VMS/Frontend/public/favicon.png;
        expires 30d;
        access_log off;
    }

    location /robots.txt {
        alias /home/ubuntu/Staffs_Management/VMS/Frontend/public/robots.txt;
        access_log off;
    }

    # -------------------------------------------------------
    # Auth endpoints — strict rate limit (5 req/min per IP)
    # Protects against brute force on login/signup/google
    # -------------------------------------------------------
    location ~ ^/api/auth/(login|signup|google) {
        limit_req zone=auth_limit burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -------------------------------------------------------
    # All other API routes → Express backend (port 5001)
    # -------------------------------------------------------
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Allow larger body for resume/file uploads (backend limit is 10mb)
        client_max_body_size 11m;
        proxy_read_timeout 120s;
    }

    # -------------------------------------------------------
    # All other routes → Next.js frontend (port 3000)
    # -------------------------------------------------------
    location / {
        limit_req zone=general burst=50 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
