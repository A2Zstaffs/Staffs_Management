# =============================================================
# A2Z Staffs VMS - Nginx Configuration (Backend API only)
# Frontend is hosted on Vercel — this config handles API only
# Copy to: /etc/nginx/conf.d/a2zstaffs.conf
# =============================================================

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name api.a2zstaffs.com;
    return 301 https://api.a2zstaffs.com$request_uri;
}

# Main HTTPS server — API only
server {
    listen 443 ssl;
    server_name api.a2zstaffs.com;

    # SSL — managed by Certbot
    # ssl_certificate /etc/letsencrypt/live/api.a2zstaffs.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.a2zstaffs.com/privkey.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # -------------------------------------------------------
    # Auth endpoints — strict rate limit (5 req/min per IP)
    # Protects against brute force on login/signup/google
    # -------------------------------------------------------
    location ~ ^/api/auth/(login|signup|google) {
        limit_req zone=auth_limit burst=3 nodelay;
        limit_req_status 429;
        limit_conn conn_limit 10;

        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -------------------------------------------------------
    # All API routes → Docker container (port 5001)
    # -------------------------------------------------------
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        limit_conn conn_limit 20;

        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 11m;
        proxy_read_timeout 120s;
    }

    # Block everything else — frontend is on Vercel
    location / {
        return 404 '{"success":false,"message":"Not found"}';
        add_header Content-Type application/json;
    }
}
